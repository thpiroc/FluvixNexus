<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy。
      Renderer は「アプリに同梱したものだけを実行し、外部と通信しない」状態を既定とする。

      運用方針:
        - 配布ビルド（file:// から読み込む本番）ではこのポリシーが全体に適用される。
        - 開発時は Vite が HMR 用の script タグをこの meta より前へ差し込むため、
          その2つ（React Refresh の preamble と /@vite/client）だけは適用外になる。
          開発サーバは localhost 固定であり、配布物には含まれないため許容する。
          「本番の CSP が正しいか」は必ずビルド後のアプリで確認すること。
        - 外部 CDN・外部フォント・外部 API は使わない。必要になっても Renderer から直接叩かず、
          Main Process 経由（IPC）で扱う。CSP を緩めるのは最後の手段とする。
        - Monaco Editor / xterm.js を導入する際は blob: Worker を使う実装ではなく、
          バンドル済みの Worker ファイルを使う構成を選び、worker-src 'self' を維持する。
        - style-src の 'unsafe-inline' は、React・Monaco・xterm が実行時に style を注入するため必要。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self';
        worker-src 'self';
        object-src 'none';
        frame-src 'none';
        base-uri 'none';
        form-action 'none'
      "
    />
    <title>Fluvix Nexus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
